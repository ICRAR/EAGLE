name: Playwright Tests
on:
  push:
  schedule:
    # Full cross-browser run, nightly.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Playwright (${{ matrix.browser }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only chromium on push; full browser matrix on schedule/manual trigger.
        browser: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["chromium", "firefox", "webkit"]') || fromJSON('["chromium"]') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.py') }}
      - name: PIP install
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install setuptools
      - name: Compile Typescript
        run: |
          npx --no-install tsc --version
          npx --no-install tsc
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browser (${{ matrix.browser }})
        # --no-install forces the locally installed @playwright/test binary instead of npx fetching a standalone copy.
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Start server
        run: python eagleServer/eagleServer.py -t /tmp --debug &
      - name: Run Playwright tests
        run: npx --no-install playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
